<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">
  <title>Titanic Journey Simulation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<div class="container my-4">

  <form id="submit_params" method="POST" action="{{ url_for('submit_new_profile') }}">
    <table class="table">
      <!-- Top row: Title | Titanic image | Cabin heading -->
      <tr>
        <td width="300px" style="text-align:center">
          <h1><b>Chapter 3<br>Design Your Titanic Traveler</b></h1>
        </td>
        <td style="text-align:center">
          <img src="static/images/small_titanic.jpg" alt="titanic" style="padding:1px; border:1px solid #021a40; width:80%; height:80%">
        </td>
        <td width="200px" style="text-align:center">
          <h3>Cabin and Port of Embarkation Details</h3>
        </td>
      </tr>

      <!-- Main row: Form fields | Results/plot | Cabin key -->
      <tr>
        <td>
          <table class="table table-borderless table-sm">
            <tr>
              <td><label>Port of Embarkation</label></td>
              <td>
                <select class="form-select" name="selected_embarked">
                  {% for port in ['Cherbourg', 'Queenstown', 'Southampton'] %}
                    <option value="{{ port }}" {% if port == selected_embarked %}selected{% endif %}>{{ port }}</option>
                  {% endfor %}
                </select>
              </td>
            </tr>
            <tr>
              <td><label>Fare</label></td>
              <td><input type="number" class="form-control" name="selected_fare" value="{{ selected_fare }}"></td>
            </tr>
            <tr>
              <td><label>Age</label></td>
              <td>
                <select class="form-select" name="selected_age">
                  {% for age in range(0, 100) %}
                    <option value="{{ age }}" {% if age == selected_age|int %}selected{% endif %}>{{ age }}</option>
                  {% endfor %}
                </select>
              </td>
            </tr>
            <tr>
              <td><label>Gender</label></td>
              <td>
                <select class="form-select" name="selected_gender">
                  {% for g in ['Male', 'Female'] %}
                    <option value="{{ g }}" {% if g == selected_gender %}selected{% endif %}>{{ g }}</option>
                  {% endfor %}
                </select>
              </td>
            </tr>
            <tr>
              <td><label>Title</label></td>
              <td>
                <select class="form-select" name="selected_title">
                  {% for t in ['Dr.', 'Master.', 'Miss.', 'Mr.', 'Mrs.', 'Rev.', 'Unknown'] %}
                    <option value="{{ t }}" {% if t == selected_title %}selected{% endif %}>{{ t }}</option>
                  {% endfor %}
                </select>
              </td>
            </tr>
            <tr>
              <td><label>Class</label></td>
              <td>
                <select class="form-select" name="selected_class">
                  {% for c in ['First', 'Second', 'Third'] %}
                    <option value="{{ c }}" {% if c == selected_class %}selected{% endif %}>{{ c }}</option>
                  {% endfor %}
                </select>
              </td>
            </tr>
            <tr>
              <td><label>Cabin</label></td>
              <td>
                <select class="form-select" name="selected_cabin">
                  {% for cab in ['A','B','C','D','E','F','G','T','Unknown'] %}
                    <option value="{{ cab }}" {% if cab == selected_cabin %}selected{% endif %}>{{ cab }}</option>
                  {% endfor %}
                </select>
              </td>
            </tr>
            <tr>
              <td><label>Number of Siblings/Spouses</label></td>
              <td>
                <select class="form-select" name="selected_sibsp">
                  {% for n in range(0, 10) %}
                    <option value="{{ n }}" {% if n == selected_sibsp|int %}selected{% endif %}>{{ n }}</option>
                  {% endfor %}
                </select>
              </td>
            </tr>
            <tr>
              <td><label>Number of Parents/Children</label></td>
              <td>
                <select class="form-select" name="selected_parch">
                  {% for n in range(0, 10) %}
                    <option value="{{ n }}" {% if n == selected_parch|int %}selected{% endif %}>{{ n }}</option>
                  {% endfor %}
                </select>
              </td>
            </tr>
          </table>
        </td>

        <td>{{ model_results }}<br>
          {% if model_plot %}
            <img src="data:image/png;base64,{{ model_plot }}" class="img-fluid" alt="Survival probability chart" style="border:1px solid #ccc; padding:4px;">
          {% endif %}
        </td>

        <td style="text-align:center">
          <p>Cabin Key</p>
          <img src="static/images/small_cabin_location.png" alt="Cabin locations" style="padding:1px; border:1px solid #021a40; width:100%; height:100%">
        </td>
      </tr>

      <!-- Button row -->
      <tr>
        <td><button class="btn btn-primary" type="submit" style="width:150px; height:50px;">All Aboard!</button></td>
        <td></td>
        <td></td>
      </tr>
    </table>
  </form>

</div>
</body>
</html>
